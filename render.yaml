services:
  - type: web
    name: revenue-recovery-agent-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: SKIP_SEED
        value: false
      - key: ALLOWED_ORIGINS
        value: https://ai-revenue-recovery.vercel.app,http://localhost:5173